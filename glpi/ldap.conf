# Configuração do cliente LDAP usada pelo GLPI (Lab 4).
# É este arquivo que faz o "Usar TLS" do GLPI verificar de verdade o certificado do
# diretório. Sem TLS_CACERT apontando para a CA da ACME, o StartTLS falharia; e com
# TLS_REQCERT never ele funcionaria sem verificar nada, que é o erro comum e silencioso.
TLS_CACERT /etc/ssl/acme/acme-ca.crt
TLS_REQCERT demand
