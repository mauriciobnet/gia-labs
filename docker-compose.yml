# GIA: stack dos laboratórios 1 a 4
#
# Base (sempre):    traefik, whoami, home, toolbox, openldap, lam, keycloak   -> Labs 1 e 2
# --profile lab3:   glpi + glpidb, grafana (LDAP direto nas aplicações)      -> Labs 3 e 4
# --profile tools:  check (verificação do ambiente, Lab 1)
#
# Subir:  docker compose --profile lab3 up -d --build --wait
# Reset:  docker compose --profile lab3 --profile tools down -v   (apaga tudo, inclusive o diretório)
#
# Porta: definida em .env (GIA_PORT, padrão 18080). Nunca 80 nem 443, porque a
# máquina do aluno pode já estar usando essas portas. O Traefik escuta na MESMA
# porta por dentro e por fora, então a URL do navegador e a URL usada pelos
# containers são idênticas (os endereços que o Keycloak devolve dependem disso).
#
# Painel do laboratório:  http://localhost:18080
#
# URLs (via Traefik, todas com :18080):
#   whoami.localhost  traefik.localhost  lam.localhost  keycloak.localhost (admin/admin)
#   glpi.localhost  grafana.localhost
#
# Os laboratórios seguintes chegam por git pull, com os serviços de que precisarem.

name: gia

x-hosts: &hosts
  # Containers resolvem estes nomes para o Traefik e usam a MESMA URL que o navegador
  # (os endereços que o Keycloak devolve ficam iguais). Só o curl do toolbox precisa do
  # encaminhador do entrypoint.
  - keycloak.localhost
  - gia.localhost
  - lam.localhost
  - whoami.localhost
  - glpi.localhost
  - grafana.localhost

services:
  traefik:
    image: traefik:v3.6   # >= v3.6 obrigatório com Docker Engine >= 29
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:${GIA_PORT:-18080}
    ports:
      # Mesma porta nos dois lados: o container escuta em ${GIA_PORT:-18080} e ela é
      # publicada com o mesmo número, para a URL não mudar de um lado para o outro.
      - "${GIA_BIND:+${GIA_BIND}:}${GIA_PORT:-18080}:${GIA_PORT:-18080}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.service=api@internal
    networks:
      gia:
        aliases: *hosts

  whoami:
    image: traefik/whoami:v1.10
    labels:
      - traefik.enable=true
      - traefik.http.routers.whoami.rule=Host(`whoami.localhost`)
    networks: [gia]

  # ================= Painel do laboratório =================
  home:
    # Painel servido na raiz: http://localhost:${GIA_PORT:-18080}
    # Usa a MESMA imagem do toolbox (alpine + python3), então não baixa nada a mais.
    build: ./toolbox
    image: gia/toolbox:v1
    command: ["python3", "/painel/servidor.py"]
    # o painel sai sozinho quando o próprio código muda; o restart traz ele de volta
    # já com a versão nova, sem precisar de docker compose up
    restart: unless-stopped
    environment:
      GIA_PORT: ${GIA_PORT:-18080}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./home:/painel:ro
      # fora de /painel: montar um volume DENTRO de outro montado como somente
      # leitura falha, porque o runc não consegue criar o ponto de montagem lá.
      - ./tutorial:/tutorial:ro
      - toolbox_out:/carimbos:ro   # o que cada lab deixou registrado
    labels:
      - traefik.enable=true
      - "traefik.http.routers.home.rule=Host(`localhost`) || Host(`gia.localhost`) || Host(`127.0.0.1`)"
      - traefik.http.services.home.loadbalancer.server.port=8000
      # Rede de segurança: qualquer host sem rota conhecida cai no painel em vez de 404.
      - "traefik.http.routers.home-catchall.rule=PathPrefix(`/`)"
      - traefik.http.routers.home-catchall.priority=1
      - traefik.http.routers.home-catchall.service=home
    networks: [gia]

  toolbox:
    build: ./toolbox
    image: gia/toolbox:v1
    command: sleep infinity
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GIA_PORT: ${GIA_PORT:-18080}
    volumes:
      - ./scripts:/work/scripts:ro
      - toolbox_out:/work/out
      # Lab 4: a PKI é gerada aqui dentro (openssl) e precisa aparecer no host para ser
      # montada no openldap, no grafana e no glpi. Por isso esta é a única montagem de
      # escrita do toolbox.
      - ./pki:/work/pki
      - ./ldap:/work/ldap:ro
      - ./grafana:/work/grafana
    networks: [gia]

  check:
    build: ./toolbox
    image: gia/toolbox:v1
    command: /check.sh
    environment:
      GIA_PORT: ${GIA_PORT:-18080}
    volumes:
      - ./scripts:/work/scripts:ro # evidencia.py, que grava o arquivo de entrega
      - toolbox_out:/work/out      # onde o Lab 1 deixa a evidência lida pelo painel
    profiles: [tools]
    networks: [gia]

  # ================= Lab 2: diretório =================
  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "ACME Ensino"
      LDAP_DOMAIN: "acme.edu.br"
      LDAP_BASE_DN: "dc=acme,dc=edu,dc=br"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_TLS: "false"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
    command: ["--copy-service", "--loglevel", "info"]
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro
      # Lab 4. A pasta começa vazia e é preenchida pelo lab; o slapd só passa a usar os
      # arquivos quando o cn=config apontar para eles. Montar a PASTA (e não cada arquivo)
      # é de propósito: montagem de arquivo único prende o inode e a troca do arquivo no
      # host não chega no container.
      - ./pki/ldap:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=acme,dc=edu,dc=br -D cn=admin,dc=acme,dc=edu,dc=br -w admin '(uid=ana.souza)' uid | grep -q 'uid: ana.souza'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [gia]

  lam:
    image: ghcr.io/ldapaccountmanager/lam:9.1
    environment:
      LDAP_SERVER: "ldap://openldap:389"
      LDAP_DOMAIN: "acme.edu.br"
      LDAP_BASE_DN: "dc=acme,dc=edu,dc=br"
      LDAP_USERS_DN: "ou=people,dc=acme,dc=edu,dc=br"
      LDAP_GROUPS_DN: "ou=groups,dc=acme,dc=edu,dc=br"
      LDAP_USER: "cn=admin,dc=acme,dc=edu,dc=br"
      LAM_PASSWORD: "admin"
      LAM_LANG: "pt_BR"
    labels:
      - traefik.enable=true
      - traefik.http.routers.lam.rule=Host(`lam.localhost`)
      - traefik.http.services.lam.loadbalancer.server.port=80
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

  # ================= Base: provedor de identidade =================
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.localhost:${GIA_PORT:-18080}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      TZ: ${TZ:-America/Sao_Paulo}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    volumes:
      - kc_data:/opt/keycloak/data
    healthcheck:
      # a imagem não tem curl; usa /dev/tcp do bash contra a porta de management (9000)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

  # ================= Lab 3: o diretório visto pelas aplicações =================
  glpidb:
    image: mariadb:11.4
    profiles: [lab3]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
    command: ["--transaction-isolation=READ-COMMITTED", "--log-bin=0"]
    volumes:
      - glpi_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [gia]

  glpi:
    # Com as cinco variáveis GLPI_DB_* a imagem instala sozinha e o aluno não passa
    # pelo assistente de instalação. Contas padrão: glpi/glpi (admin), tech/tech,
    # normal/normal, post-only/postonly.
    image: glpi/glpi:10.0.26
    profiles: [lab3]
    environment:
      GLPI_DB_HOST: glpidb
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: glpi
      GLPI_DB_USER: glpi
      GLPI_DB_PASSWORD: glpi
      TZ: ${TZ:-America/Sao_Paulo}
      # Lab 4. O GLPI usa a libldap do sistema; ela lê a CA do ldap.conf montado abaixo.
      # A variável é cinto e suspensório para o caso de o PHP receber o ambiente.
      LDAPTLS_CACERT: /etc/ssl/acme/acme-ca.crt
    volumes:
      - glpi_var:/var/glpi
      - ./pki/ca:/etc/ssl/acme:ro
      # Duas montagens do MESMO arquivo porque o caminho do ldap.conf muda conforme a base
      # da imagem (Debian usa /etc/ldap, Alpine usa /etc/openldap). Montar nos dois evita
      # depender de qual é a de hoje.
      - ./glpi/ldap.conf:/etc/ldap/ldap.conf:ro
      - ./glpi/ldap.conf:/etc/openldap/ldap.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.glpi.rule=Host(`glpi.localhost`)
      - traefik.http.services.glpi.loadbalancer.server.port=80
    depends_on:
      glpidb: { condition: service_healthy }
      openldap: { condition: service_healthy }
    networks: [gia]

  grafana:
    image: grafana/grafana-oss:11.6.0
    # Lab 3: autentica direto no diretório (LDAP). Lab 4: a mesma conexão passa a ser cifrada.
    profiles: [lab3]
    volumes:
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml:ro
      - ./pki/ca:/etc/grafana/pki:ro   # Lab 4: root_ca_cert = /etc/grafana/pki/acme-ca.crt
    environment:
      GF_SERVER_ROOT_URL: http://grafana.localhost:${GIA_PORT:-18080}
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_LDAP_ENABLED: "true"
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true" 
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak ACME"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana-secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: "http://keycloak.localhost:${GIA_PORT:-18080}/realms/acme/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Fgrafana.localhost%3A18080%2Flogin"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'ti') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    depends_on:
      openldap: { condition: service_healthy }
    networks: [gia]

networks:
  gia:

volumes:
  glpi_db:
  glpi_var:
  ldap_data:
  ldap_config:
  kc_data:
  toolbox_out:
